<div class="layout-container">
  <div *ngIf="isLoading$ | async; else photoDescription">
    <mat-progress-bar></mat-progress-bar>
  </div>

  <ng-template #photoDescription>
    <div class="gallery" fxLayout.sm="column">
      <div *ngIf="photo$ | async as photo">
        <redsui-card-photo [photo]="photo"></redsui-card-photo>
      </div>
    </div>
  </ng-template>
</div>
